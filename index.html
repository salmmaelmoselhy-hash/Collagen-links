<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Collagen</title>

<style>
    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        min-height: 100vh;
        font-family: Arial, sans-serif;
        background: #f8f3ee;
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 30px 20px;
        color: #3b2923;
    }

    .container {
        width: 100%;
        max-width: 430px;
        text-align: center;
    }

    .logo {
        width: 105px;
        height: 105px;
        border-radius: 50%;
        background: #3b2923;
        color: white;
        display: flex;
        justify-content: center;
        align-items: center;
        margin: 0 auto 20px;
        font-size: 28px;
        font-weight: bold;
        letter-spacing: 1px;
    }

    h1 {
        margin: 0;
        font-size: 38px;
        letter-spacing: 2px;
    }

    .arabic {
        margin-top: 4px;
        font-size: 21px;
        direction: rtl;
    }

    .subtitle {
        margin: 12px 0 28px;
        font-size: 14px;
        color: #806c63;
    }

    .link {
        display: block;
        text-decoration: none;
        color: #3b2923;
        background: white;
        margin: 14px 0;
        padding: 17px 20px;
        border-radius: 16px;
        font-size: 17px;
        font-weight: bold;
        box-shadow: 0 4px 14px rgba(60,40,30,0.08);
        transition: 0.2s;
    }

    .link:hover {
        transform: translateY(-2px);
    }

    .icon {
        margin-right: 9px;
    }

    .footer {
        margin-top: 28px;
        font-size: 12px;
        color: #a18e84;
    }
</style>
</head>

<body>

<div class="container">

    <div class="logo">C</div>

    <h1>Collagen</h1>

    <div class="arabic">كولاجين</div>

    <div class="subtitle">
        Homemade goodness, made with love 🤎
    </div>

    <a class="link" href="https://www.instagram.com/coll.agenbroth" target="_blank">
        <span class="icon">📸</span> Instagram
    </a>

    <a class="link" href="https://www.facebook.com/share/1DtMuDbpWH/" target="_blank">
        <span class="icon">📘</span> Facebook
    </a>

    <a class="link" href="https://wa.me/201229558910" target="_blank">
        <span class="icon">💬</span> WhatsApp
    </a>

    <div class="footer">
        Collagen • Follow us & stay connected
    </div>

</div>

</body>
  </html>
